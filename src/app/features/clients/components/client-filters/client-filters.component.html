<div class="crm-filters" [formGroup]="searchForm">
  <crm-search-input
    formControlName="text"
    placeholder="Search by company, phone, or contact person..."
    labelKey="companyName"
    [searchFn]="clientSearchFn"
    (enterPressed)="search()">
  </crm-search-input>

  <div class="crm-filters__actions">
    <div class="crm-filters__status-dropdown">
      <crm-dropdown formControlName="status">
        <div crm-dropdown-trigger>
          @switch (searchForm.value.status) {
            @case ('all') { All Statuses }
            @case (ClientStatusEnum.ACTIVE) { Active }
            @case (ClientStatusEnum.LEAD) { Lead }
            @case (ClientStatusEnum.ARCHIVED) { Archived }
          }
        </div>
        <div crm-dropdown-option [value]="'all'">All Statuses</div>
        <div crm-dropdown-option [value]="ClientStatusEnum.ACTIVE">Active</div>
        <div crm-dropdown-option [value]="ClientStatusEnum.LEAD">Lead</div>
        <div crm-dropdown-option [value]="ClientStatusEnum.ARCHIVED">Archived</div>
      </crm-dropdown>
    </div>

    <div class="crm-filters__results">
      {{ totalResults() }} results found
    </div>

    <button crm-btn type="button" variant="primary" size="md" [loading]="isLoading()" (click)="search()" title="Search">
      Search
    </button>
  </div>
</div>

<crm-filter-chips
  [items]="filterChips()"
  [currentStatus]="currentStatus()"
  (statusChange)="onStatusChange($event)">
</crm-filter-chips>
